name: build

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Also upload a zip per OS for a release
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: windows
            os: windows-latest
            cmake_args: -A x64
          - name: macos
            os: macos-latest
            cmake_args: -G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: UI font coverage + realistic AEC tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y espeak-ng
          python3 -m pip install --user numpy scipy fonttools
          python3 tools/make_ui_font.py --check
          python3 tests/realistic/run_realistic.py --check build/aec_wav build/realistic
          python3 tests/realistic/run_voicechat.py --check build/aec_wav build/voicechat
          python3 tests/realistic/run_realistic.py --check --only music_pop__stereo,music_pop__no_echo,speech_mono__no_echo,music_pop__weak_echo build/aec_wav build/realistic_auto --auto

      - name: Collect plugin
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/AbleAEC_artefacts/Release/VST3/AbleAEC.vst3 dist/
          if [ -d build/AbleAEC_artefacts/Release/AU ]; then cp -R build/AbleAEC_artefacts/Release/AU/AbleAEC.component dist/; fi
          mkdir -p dist/App
          cp -R build/AbleAEC_artefacts/Release/Standalone/. dist/App/

      - uses: actions/upload-artifact@v4
        with:
          name: AbleAEC-${{ matrix.name }}
          path: dist

      - name: Package release zip
        if: inputs.package
        shell: bash
        run: |
          PKG=AbleAEC-${{ matrix.name }}
          rm -rf "$PKG" && cp -R dist "$PKG"
          if [ "$RUNNER_OS" = macOS ]; then ditto -c -k --keepParent "$PKG" "$PKG.zip"
          elif [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$PKG.zip" "$PKG" > /dev/null
          else zip -qry "$PKG.zip" "$PKG"; fi

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: release-${{ matrix.name }}
          path: AbleAEC-${{ matrix.name }}.zip
          compression-level: 0
